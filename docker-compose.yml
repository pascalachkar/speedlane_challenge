services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: movie_library
      POSTGRES_USER: movie_library
      POSTGRES_PASSWORD: movie_library
    ports:
      - '55432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U movie_library -d movie_library']
      interval: 5s
      timeout: 5s
      retries: 10

  database-init:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://movie_library:movie_library@database:5432/movie_library?schema=public
      SEED_IF_EMPTY: 'true'
    command:
      - /bin/sh
      - -c
      - >-
        ./apps/api/node_modules/.bin/prisma migrate deploy --schema apps/api/prisma/schema.prisma &&
        ./node_modules/.bin/tsx apps/api/prisma/seed.ts
    depends_on:
      database:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 3000
      WEB_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
      DATABASE_URL: postgresql://movie_library:movie_library@database:5432/movie_library?schema=public
      JWT_ACCESS_SECRET: local-docker-access-secret-change-before-deployment
      JWT_REFRESH_SECRET: local-docker-refresh-secret-change-before-deployment
      COOKIE_SECURE: 'false'
    ports:
      - '3000:3000'
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api/v1
    ports:
      - '5173:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
